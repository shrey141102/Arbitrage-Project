[project]
name = "python-capstone"
version = "0.1.0"
description = "Microstructure-aware FX graph arbitrage backtest"
requires-python = ">=3.11,<4.0"
dependencies = [
    "matplotlib (>=3.8,<4.0)",
    "numpy (>=2.0,<3.0)",
    "polars (>=1.0,<3.0)",
    "pandas (>=2.2,<4.0)",
    "pyarrow (>=14,<27)",
    "requests (>=2.31,<3.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
